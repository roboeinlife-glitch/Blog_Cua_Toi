---
layout: default
---

<div id="main" role="main">
  <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
    
    <!-- ⭐ COPY NGUYÊN CẤU TRÚC AUTHOR PROFILE TỪ TRANG CHỦ ⭐ -->
    <div class="custom-author-header">
  <img src="/Blog_Cua_Toi/assets/images/Gimball.png" alt="RoboE_inlife" class="custom-avatar">
  <span class="custom-author-name">RoboE_inlife</span>
</div>
    <!-- TIÊU ĐỀ BÀI VIẾT -->
    <header>
      <h1 id="page-title" class="page__title" itemprop="headline">
        {{ page.title }}
      </h1>
    </header>

    <!-- NỘI DUNG BÀI VIẾT -->
    <section class="page__content" itemprop="text">
      {{ content }}
    </section>

    <!-- Các phần khác giữ nguyên -->
    <footer class="page__meta">
      {% include page__taxonomy.html %}
      {% include page__date.html %}
    </footer>

    {% if page.share %}
      {% include social-share.html %}
    {% endif %}

    {% include post_pagination.html %}

    {% if page.comments %}
      <div class="page__comments">
        {% include comments.html %}
      </div>
    {% endif %}

  </article>
</div>
