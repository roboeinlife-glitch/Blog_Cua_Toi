title: "Blog của RoboE"
description: "Nơi chia sẻ những điều thú vị"
baseurl: "/Blog_Cua_Toi"
url: "https://roboeinlife-glitch.github.io"

# 🎨 QUAN TRỌNG: Theme hỗ trợ icon mạng xã hội
remote_theme: mmistakes/minimal-mistakes

# 👤 Cấu hình tác giả và liên kết mạng xã hội
author:
  name: "RoboE_inlife"
  avatar: "/assets/images/Gimball.png"
  bio: "Chào mừng bạn đến với blog của tôi!"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/roboeinlife-glitch"
    - label: "YouTube"
      icon: "fab fa-youtube"
      url: "https://www.youtube.com/@RoboE_Life"
    - label: "Twitter"
      icon: "fab fa-twitter"
      url: "https://x.com/roboe_inlife"

# ⚙️ Các cài đặt kỹ thuật khác
show_downloads: true
permalink: /:year/:month/:day/:title:output_ext
markdown: kramdown
highlighter: rouge
timezone: Asia/Ho_Chi_Minh
future: true

# 🛠️ Plugin bắt buộc cho theme Minimal Mistakes
plugins:
  - jekyll-include-cache

# 🌀 Cấu hình Phân trang (Pagination) - QUAN TRỌNG cho trang chủ
# paginate: 5  # Số bài viết trên mỗi trang chủ
# paginate_path: "/page:num/"  # Đường dẫn cho các trang tiếp theo (vd: /page2/)

# 📄 Cấu hình mặc định cho toàn bộ bài viết
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      author_profile: true
      layout: single
      sidebar:
        nav: "sidebar"
      comments: true          # Bật comments cho tất cả bài posts
      show_title: false       # ✅ THÊM DÒNG NÀY ĐỂ ẨN TIÊU ĐỀ TRÙNG LẶP

# 🗣️ CẤU HÌNH GISCUS
giscus:
  repo: "roboeinlife-glitch/Blog_Cua_Toi"
  repo_id: "R_kgDOQvix-g"
  category: "Announcements"
  category_id: "DIC_kwDOQvix-s4C6qRD"
  mapping: "pathname"
  strict: "0"
  reactions_enabled: "1"
  emit_metadata: "0"
  input_position: "bottom"
  theme: "preferred_color_scheme"
  lang: "vi"
